<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sara Vera - Работа в Польше</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f9f9f9;
      color: #333;
    }
    header {
      background: #e63946;
      color: #fff;
      padding: 20px;
      text-align: center;
    }
    header h1 {
      margin: 0;
    }
    .contact {
      margin-top: 10px;
      font-size: 14px;
    }
    .offer {
      display: flex;
      justify-content: space-around;
      padding: 20px;
      background: #fff;
    }
    .offer-item {
      text-align: center;
      width: 30%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
      background: #f1f1f1;
    }
    .form-section {
      background: #fff;
      padding: 20px;
      margin: 20px;
      border-radius: 5px;
      border: 1px solid #ddd;
    }
    .form-section h2 {
      margin-top: 0;
    }
    form {
      display: flex;
      flex-direction: column;
    }
    label {
      margin: 10px 0 5px;
    }
    input {
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 3px;
    }
    button {
      margin-top: 15px;
      padding: 10px;
      background: #e63946;
      color: #fff;
      border: none;
      border-radius: 3px;
      cursor: pointer;
    }
    button:hover {
      background: #d62828;
    }
  </style>
</head>
<body>

  <header>
    <h1>Sara Vera</h1>
    <div class="contact">
      Телефон: +48 607 776 867 | Языки: 🇺🇦 🇷🇺 🇵🇱
    </div>
  </header>

  <section class="offer">
    <div class="offer-item">
      <h3>💰 28 злотых/час нетто</h3>
    </div>
    <div class="offer-item">
      <h3>🚌 Транспорт до работы</h3>
    </div>
    <div class="offer-item">
      <h3>🔑 Жильё</h3>
    </div>
  </section>

  <section class="form-section">
    <h2>Получить предложение</h2>
    <form>
      <label for="name">Имя</label>
      <input type="text" id="name" name="name" required>

      <label for="phone">Телефон (Viber/Telegram)</label>
      <input type="text" id="phone" name="phone" required>

      <button type="submit">Оставить заявку</button>
    </form>
  </section>

</body>
</html>
